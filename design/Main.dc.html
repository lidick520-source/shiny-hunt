<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>整块屏幕布局</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #2B3A4A; font-family: 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; color: #1B1E1D">

<div style="position: absolute; left: 0; top: 0; width: 1440px; height: 25px; background: rgba(250,250,248,0.92); display: flex; align-items: center; gap: 18px; padding: 0 16px; box-sizing: border-box; font-size: 13px; color: #1B1E1D">
<span style="font-weight: 700">PokeMMO</span><span>文件</span><span>窗口</span>
<span style="flex-grow: 1"></span><span>屏幕 1440×900</span>
</div>

<div style="position: absolute; left: 0; top: 25px; width: 1024px; height: 796px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.35)">
<div style="height: 28px; background: #E9E9E4; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid #CFCFC8">
<span style="width: 12px; height: 12px; border-radius: 50%; background: #E0443E"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #DEA123"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #1AAB29"></span>
<span style="flex-grow: 1; text-align: center; font-size: 13px; color: #3B403E">PokeMMO</span>
</div>
<div style="flex-grow: 1; background: repeating-linear-gradient(45deg, #DCE3E8 0 18px, #D2DAE0 18px 36px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
<div style="font-size: 26px; font-weight: 700; color: #34475A">[ 游戏画面 1024×768 ]</div>
<div style="font-size: 15px; color: #34475A">助手运行时，游戏一直保持在前台，不被任何东西挡住</div>
</div>
</div>

<div style="position: absolute; left: 1032px; top: 25px; width: 400px; height: 796px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); border-radius: 12px; overflow: hidden">
<dc-import name="Running" hint-size="400px,796px"></dc-import>
</div>

<div style="position: absolute; left: 470px; top: 832px; height: 60px; padding: 0 16px; border-radius: 16px; background: rgba(250,250,248,0.55); display: flex; align-items: center; gap: 12px">
<span style="width: 40px; height: 40px; border-radius: 10px; background: #FFFFFF"></span>
<span style="width: 40px; height: 40px; border-radius: 10px; background: #FFFFFF"></span>
<span style="width: 40px; height: 40px; border-radius: 10px; background: #FFFFFF"></span>
<span style="width: 40px; height: 40px; border-radius: 10px; background: #FFFFFF"></span>
<span style="font-size: 12px; color: #1B1E1D">程序坞</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
